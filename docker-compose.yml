services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xray
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray -d xray"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/xray
      SPRING_DATASOURCE_USERNAME: xray
      SPRING_DATASOURCE_PASSWORD: xray
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XRAY_AI_MODEL: ${XRAY_AI_MODEL:-gpt-5.6-luna}
      XRAY_AI_PER_IP_PER_HOUR: ${XRAY_AI_PER_IP_PER_HOUR:-20}
      XRAY_AI_PER_HOUR: ${XRAY_AI_PER_HOUR:-200}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
