services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xray
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray -d xray"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/xray
      SPRING_DATASOURCE_USERNAME: xray
      SPRING_DATASOURCE_PASSWORD: xray
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XRAY_AI_MODEL: ${XRAY_AI_MODEL:-claude-opus-5-5}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
