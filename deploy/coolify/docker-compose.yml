# Coolify (Docker Compose build pack) for x-ray.aragorn.fyi. Coolify builds both images from this repo
# on every push to main. The edge proxy (github.com/sentance/edge-proxy) reaches the app privately as
# xray-web:80 on the shared coolify network, so nothing is published on the host and
# docker_compose_domains stays empty.
#
# The database is the platform's shared-postgres (database and role `xray`), reached over the coolify
# network. Service names are prefixed on purpose: generic names like `backend` collide with other
# apps' aliases on that shared network.
#
# Build contexts are relative to the repo root, as Coolify resolves them. To try it locally:
#   docker compose --project-directory . -f deploy/coolify/docker-compose.yml config
#
# Coolify environment variables (runtime only): DB_PASSWORD, ANTHROPIC_API_KEY, XRAY_AI_MODEL, and optionally
# XRAY_AI_PER_IP_PER_HOUR / XRAY_AI_PER_HOUR (hourly caps on Claude requests).
# No `:?` guards: Coolify interpolates this file at build time too, without runtime-only values.
services:
  xray-backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-shared-postgres}:5432/${DB_NAME:-xray}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-xray}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XRAY_AI_MODEL: ${XRAY_AI_MODEL:-claude-opus-5-5}
      XRAY_AI_PER_IP_PER_HOUR: ${XRAY_AI_PER_IP_PER_HOUR:-20}
      XRAY_AI_PER_HOUR: ${XRAY_AI_PER_HOUR:-200}
    expose:
      - "8080"
    networks:
      - default
      - coolify
    healthcheck:
      # The temurin JRE image has no curl/wget; bash's /dev/tcp is enough to read the health status.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  xray-web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: xray-backend:8080
    expose:
      - "80"
    depends_on:
      xray-backend:
        condition: service_healthy
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  coolify:
    external: true
